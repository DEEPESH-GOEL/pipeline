pipeline:
  projectIdentifier: Deepeshtestiacm
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: Stage 1.1
        identifier: Provision_IaCM
        description: ""
        type: IACM
        spec:
          workspace: <+input>
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: plan
                  identifier: plan
                  timeout: 10m
                  spec:
                    command: plan
        tags: {}
        sendGitStatus:
          enabled: true
          name: ""
  notificationRules:
    - name: Deepesh-IaCM Pipeline Notification
      identifier: DeepeshIaCM_Pipeline_Notification
      pipelineEvents:
        - type: PipelineSuccess
        - type: PipelineFailed
      notificationMethod:
        type: Slack
        spec:
          userGroups:
            - Test
          webhookUrl: ""
      enabled: true
  identifier: TF_Apply
  name: TF Apply
